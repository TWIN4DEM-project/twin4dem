[project]
name = "twin4dem"
version = "0.1.0"
description = "TWIN4DEM as a Django web app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "case-switcher>=1.3.13",
    "celery>=5.6.0",
    "channels-redis>=4.3.0",
    "channels[daphne]>=4.3.2",
    "daphne>=4.2.1",
    "django>=6.0.0",
    "django-allauth[socialaccount]>=65.13.1",
    "django-pydantic-field>=0.5.1",
    "django-sass-processor>=1.4.2",
    "django-vite>=3.1.0",
    "djangorestframework>=3.16.1",
    "psycopg2>=2.9.11",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
]

[tool.uv]
package = true

[tool.uv.build-backend]
namespace = true

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
addopts = "--cov=src --cov-branch --cov-report xml:./coverage.xml --cov-report term-missing:skip-covered"

[tool.coverage.run]
omit = [
    "*/api/services/_batch_simulation.py",
    "manage.py",
    "*/twin4dem/settings.py",
    "*/twin4dem/settings_dev.py",
]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.(pyi?|ipynb)$'

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"common.models._aggrandisement".msg = "Import from the public common.models interface instead."
"common.models._belief".msg = "Import from the public common.models interface instead."
"common.models._executive".msg = "Import from the public common.models interface instead."
"common.models._influence".msg = "Import from the public common.models interface instead."
"common.models._judiciary".msg = "Import from the public common.models interface instead."
"common.models._legislative".msg = "Import from the public common.models interface instead."
"common.models._simulation".msg = "Import from the public common.models interface instead."
"common.models.institution._branch".msg = "Import from the public common.models.institution interface instead."
"common.models.institution._institution".msg = "Import from the public common.models.institution interface instead."
"common.models.institution._kind".msg = "Import from the public common.models.institution interface instead."
"common.models.party._party".msg = "Import from the public common.models.party interface instead."
"common.models.party._party_position".msg = "Import from the public common.models.party interface instead."
"common.models.timeline._spec".msg = "Import from the public common.models.timeline interface instead."
"common.models.timeline._subjects".msg = "Import from the public common.models.timeline interface instead."
"common.models.timeline._timeframe".msg = "Import from the public common.models.timeline interface instead."
"common.models.timeline._timeline".msg = "Import from the public common.models.timeline interface instead."
"common.models.timeline._validation".msg = "Import from the public common.models.timeline interface instead."
"common.models.world._country".msg = "Import from the public common.models.world interface instead."
"common.models.world._settings".msg = "Import from the public common.models.world interface instead."

[tool.ruff.lint.per-file-ignores]
"src/twin4dem/settings_dev.py" = ["F403", "F405"]
"src/common/models/**" = ["TID251"]
"src/common/migrations/**" = ["TID251"]

[dependency-groups]
dev = [
    "black[jupyter]>=25.12.0",
    "django-browser-reload>=1.21.0",
    "django-compressor>=4.6.0",
    "django-debug-toolbar>=6.1.0",
    "django-watchfiles>=1.4.0",
    "libsass>=0.23.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.11.1",
    "ruff>=0.14.9",
    "types-channels>=4.3.0.20250822",
]
prod = []
notebooks = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.46",
]
