name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  lint:
    name: Lint (make check)
    runs-on: ubuntu-latest
    steps:
      - name: Refuse fork PRs
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Fork PRs can't read TWIN4DEM-project/twin4dem-data-contracts. A maintainer must push this branch to the main repo."
          exit 1
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create read-only token for twin4dem-data-contracts
        id: t4d-data-contracts-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TWIN4DEM_CI_CLIENT_ID }}
          private-key: ${{ secrets.TWIN4DEM_CI_PRIVATE_KEY }}
          owner: TWIN4DEM-project
          repositories: twin4dem-data-contracts
          permission-contents: read

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
            enable-cache: true

      - name: Run linter (make check)
        env:
          DEP_TOKEN: ${{ steps.t4d-data-contracts-token.outputs.token }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$DEP_TOKEN"; }; f'
        run: |
          mkdir -p artifacts
          # Capture full output to artifact
          make -C backend check

  test:
    name: Test (make test) + Report
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
            persist-credentials: false

      - name: Create read-only token for twin4dem-data-contracts
        id: t4d-data-contracts-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TWIN4DEM_CI_CLIENT_ID }}
          private-key: ${{ secrets.TWIN4DEM_CI_PRIVATE_KEY }}
          owner: TWIN4DEM-project
          repositories: twin4dem-data-contracts
          permission-contents: read

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
            enable-cache: true

      - name: Prepare test report directory
        run: mkdir -p pytest-results

      - name: Run tests (make test) and produce JUnit xml
        env:
          PYTEST_ADDOPTS: --junitxml=pytest-results/junit.xml
          DEP_TOKEN: ${{ steps.t4d-data-contracts-token.outputs.token }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$DEP_TOKEN"; }; f'
        run: make -C backend test
      - name: Show test report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Backend Tests
          path: backend/pytest-results/junit.xml
          reporter: python-xunit

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: backend/**/coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '66 85'

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
